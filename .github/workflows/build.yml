name: Build ImmortalWrt via ImageBuilder

on:
  workflow_dispatch:
    inputs:
      custom_router_ip:
        description: '路由器管理地址'
        required: true
        default: '192.168.50.5'
      profile:
        description: '固件大小 (MB)'
        required: true
        default: '512'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set permissions
        run: chmod -R +x shell/ x86-64/

      - name: Save router IP
        run: |
          mkdir -p files/etc/config
          echo "${{ github.event.inputs.custom_router_ip }}" > files/etc/config/custom_router_ip.txt
          echo "管理地址设为: ${{ inputs.custom_router_ip }}"

      - name: Build via ImageBuilder
        run: |
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/home/build/immortalwrt/build.sh" \
            -e ROOTFS_PARTSIZE="${{ github.event.inputs.profile }}" \
            immortalwrt/imagebuilder:x86-64-openwrt-25.12 \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Cleanup old releases (keep 2 latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 清理旧 Release，保留最新 2 个..."
          releases=$(gh release list --repo ${{ github.repository }} \
            --json tagName --jq '.[].tagName' \
            --order desc --limit 50 2>/dev/null | grep '^ImmortalWrt-' || true)
          count=0
          for tag in $releases; do
            count=$((count+1))
            if [ "$count" -gt 2 ]; then
              echo "  删除: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes 2>/dev/null || true
              # 本地 tag 也要删，否则下次 gh release 会报 tag exists
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done
          echo " ✅ 清理完成"

      - name: Upload firmware
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ImmortalWrt-${{ github.run_number }}
          name: "ImmortalWrt #${{ github.run_number }}"
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi*
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-rootfs*
          token: ${{ secrets.GITHUB_TOKEN }}
