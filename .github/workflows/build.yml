name: Build ImmortalWrt via ImageBuilder

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: '选择 luci 版本'
        required: false
        default: '25.12'
        type: choice
        options:
          - '25.12'
      pppoe_account:
        description: 'PPPoE 宽带账号'
        required: false
      pppoe_password:
        description: 'PPPoE 宽带密码'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set permissions
        run: chmod -R +x shell/ x86-64/

      - name: Build via ImageBuilder
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/home/build/immortalwrt/build.sh" \
            immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmortalWrt-ImageBuilder
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
